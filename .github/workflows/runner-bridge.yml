name: Runner Bridge Tests
on:
  pull_request:
  push:
    branches: [agent/issue-14-runner-bridge]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - run: python -m compileall control runners tests
      - run: python scripts/verify_v1_0_protection.py
      - run: python -m unittest discover -s tests -v
