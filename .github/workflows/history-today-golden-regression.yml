name: History Today Golden Regression Gate

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

jobs:
  golden-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify media tooling
        run: ffmpeg -version

      - name: Verify governance contracts
        run: python -m unittest tests/test_golden_governance.py -v

      - name: Run immutable Golden Regression
        run: python tools/run_history_today_golden_regression.py

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-today-golden-regression
          path: reports/golden_regression/
