name: History Today Golden Regression Gate

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

jobs:
  golden-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Verify governance contracts
        run: python -m unittest tests/test_golden_governance.py -v

      - name: Verify local production evidence
        run: python tools/ci/verify_local_production_evidence.py

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-today-golden-regression
          path: reports/
